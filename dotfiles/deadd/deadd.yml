### deadd (linux notification center) configuration -- themed for this i3 setup.
### Location: ~/.config/deadd/deadd.yml (deadd resolves its config dir via
### getXdgDirectory XdgConfig ""). The matching CSS is ~/.config/deadd/deadd.css.
### See "Notifications (deadd)" in i3-setup.md.

### Outer margins of the notification center / notifications. These map to deadd's
### bar-height settings: the center is drawn full-height minus margin-top (space
### reserved at the top of the screen) and margin-bottom (space at the bottom), then
### moved down by margin-top. polybar sits at the BOTTOM of every monitor (~32px,
### 24pt @ 96dpi), so margin-bottom lifts the center clear of it instead of the
### center overlapping the bar. Both monitors' bottom bars are the same height.
margin-top: 0
margin-right: 0
margin-bottom: 32

### Width of the notification center and pop-ups (px).
width: 400

### Open on whichever monitor currently has the mouse (dual-monitor friendly).
follow-mouse: true

notification-center:
  ### Close the center when the pointer leaves it.
  hide-on-mouse-leave: true
  ### Newest notifications on top.
  new-first: true

notification:
  ### Render pango markup (<b>, <i>, <u>, <a>) and HTML entities.
  use-markup: true
  parse-html-entities: true

  app-icon:
    ### Fall back to guessing an app icon from the app name when none is sent.
    guess-icon-from-name: true
    icon-size: 24

  image:
    ### Max size of images embedded in notifications (px).
    size: 80

  popup:
    ### How long pop-ups stay on screen (ms); notify-send -t overrides.
    default-timeout: 8000
    ### Keep pop-ups clear of the screen edges; polybar is at the bottom so the
    ### default top-right placement doesn't collide with it.
    margin-top: 12
    margin-right: 12
    margin-between: 10
    ### Truncate long bodies in the pop-up (full text stays in the center). Set high
    ### enough for the polybar-detail popups (bin/polybar-detail), whose CPU/memory
    ### breakdowns run to ~8 lines (load/usage summary + a top-processes list).
    max-lines-in-body: 10
