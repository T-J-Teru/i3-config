; Polybar starter config for i3 on this machine.
; See i3-setup.md ("Status bar (polybar)"). Hardware-specific values (battery BAT0/AC,
; wifi wlp0s20f3, backlight intel_backlight) are noted where they appear -- adjust per machine.
; Reload/inspect modules with `polybar-msg cmd hide/show` etc.; launched via launch.sh.

[colors]
background     = #222222
background-alt = #444444
foreground     = #dfdfdf
disabled       = #707880
primary        = #4c7899
alert          = #bd2c40

[bar/main]
; Rendered once per connected monitor (launch.sh sets MONITOR / TRAY_POSITION).
monitor = ${env:MONITOR:}
; Dock at the bottom of the screen (default is top).
bottom = true
width  = 100%
height = 24pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
padding-right = 1
module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

; font-0: text (labels, workspace names). monospace is guaranteed present.
; font-1: glyph icons for the status modules. Font Awesome 6 Free (Solid) is
; installed by install.sh (package fontawesome-6-free-fonts). Modules reference it
; with the %{T2} font token (T1 = font-0, T2 = font-1). If icons render as boxes,
; the font is missing -- run install.sh or `sudo dnf install fontawesome-6-free-fonts`.
font-0 = monospace:size=10;2
font-1 = Font Awesome 6 Free:style=Solid:size=10;3

modules-left   = i3
modules-center =
modules-right  = backlight pulseaudio fs memory cpu wlan battery date power

; Only the primary monitor's bar claims the system tray (launch.sh sets this).
tray-position = ${env:TRAY_POSITION:none}

cursor-click = pointer
enable-ipc = true

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-scroll = true
wrapping-scroll = false

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-padding = 2

label-visible = %name%
label-visible-background = ${colors.background-alt}
label-visible-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/backlight]
type = internal/backlight
; Backlight device on this machine (ls /sys/class/backlight).
card = intel_backlight
use-actual-brightness = true
enable-scroll = true
; Sun glyph in place of the old "BL" text.
label = %{T2}%{T-} %percentage%%

[module/pulseaudio]
type = internal/pulseaudio
; Speaker glyph ramps with the volume level; a crossed-out speaker when muted.
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = %{T2}%{T-}
ramp-volume-1 = %{T2}%{T-}
ramp-volume-2 = %{T2}%{T-}
label-muted = %{T2}%{T-} muted
label-muted-foreground = ${colors.disabled}

[module/fs]
type = internal/fs
; / and /home share the same filesystem here, so monitoring / covers both.
mount-0 = /
interval = 30
label-mounted = %{T2}%{T-} %percentage_used%%
label-unmounted =

[module/memory]
type = internal/memory
interval = 2
; Left-click pops a deadd notification with usage + top processes by RAM
; (~/bin/polybar-detail). The %{A1:...:} action tag wraps the label in a click
; region -- more reliable for internal modules than a bare `click-left`.
; See "Status bar (polybar)" in i3-setup.md.
format = %{A1:polybar-detail memory:}<label>%{A}
label = %{T2}%{T-} %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 2
; Left-click pops a deadd notification with load averages + top processes by CPU.
format = %{A1:polybar-detail cpu:}<label>%{A}
label = %{T2}%{T-} %percentage%%

[module/wlan]
type = internal/network
; Wireless interface on this machine (ls /sys/class/net).
interface = wlp0s20f3
interface-type = wireless
interval = 5
label-connected = %{T2}%{T-} %essid% %signal%%
label-disconnected = %{T2}%{T-} down
label-disconnected-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
; Battery/adapter names on this machine (ls /sys/class/power_supply).
battery = BAT0
adapter = AC
low-at = 15
; Left-click pops a deadd notification with charge, state, draw and time-remaining.
; Wrapped in %{A1:...:} per-state format tags (below) rather than a bare `click-left`,
; which doesn't fire reliably on internal modules.
; Capacity glyph fills up with charge; a bolt is prepended while charging.
format-charging = %{A1:polybar-detail battery:}<ramp-capacity> %{T2}%{T-} <label-charging>%{A}
format-discharging = %{A1:polybar-detail battery:}<ramp-capacity> <label-discharging>%{A}
format-full = %{A1:polybar-detail battery:}<ramp-capacity> <label-full>%{A}
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-low = %percentage%%
ramp-capacity-0 = %{T2}%{T-}
ramp-capacity-1 = %{T2}%{T-}
ramp-capacity-2 = %{T2}%{T-}
ramp-capacity-3 = %{T2}%{T-}
ramp-capacity-4 = %{T2}%{T-}

[module/date]
type = internal/date
interval = 30
; Uses the system timezone (now Europe/London). 24-hour clock, no seconds.
date = %Y-%m-%d %H:%M
label = %{T2}%{T-} %date%

[module/power]
type = custom/text
; Power-off glyph; left-click opens the rofi power menu (~/bin/i3-power-menu,
; also bound to $mod+Escape in the i3 config).
content = %{T2}%{T-}
content-foreground = ${colors.foreground}
click-left = i3-power-menu

[settings]
; Reload bars automatically when outputs change (dock/undock).
screenchange-reload = true
