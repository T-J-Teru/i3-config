; Polybar starter config for i3 on this machine.
; See i3-setup.md ("Status bar (polybar)"). Hardware-specific values (battery BAT0/AC,
; wifi wlp0s20f3, backlight intel_backlight) are noted where they appear -- adjust per machine.
; Reload/inspect modules with `polybar-msg cmd hide/show` etc.; launched via launch.sh.

[colors]
background     = #222222
background-alt = #444444
foreground     = #dfdfdf
disabled       = #707880
primary        = #4c7899
alert          = #bd2c40

[bar/main]
; Rendered once per connected monitor (launch.sh sets MONITOR / TRAY_POSITION).
monitor = ${env:MONITOR:}
; Dock at the bottom of the screen (default is top).
bottom = true
width  = 100%
height = 24pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
padding-right = 1
module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

; monospace is guaranteed present (same family the i3 config uses). Swap in a Nerd Font
; later if you want glyph icons instead of the text labels below.
font-0 = monospace:size=10;2

modules-left   = i3
modules-center =
modules-right  = backlight pulseaudio fs memory cpu wlan battery date

; Only the primary monitor's bar claims the system tray (launch.sh sets this).
tray-position = ${env:TRAY_POSITION:none}

cursor-click = pointer
enable-ipc = true

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-scroll = true
wrapping-scroll = false

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-padding = 2

label-visible = %name%
label-visible-background = ${colors.background-alt}
label-visible-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/backlight]
type = internal/backlight
; Backlight device on this machine (ls /sys/class/backlight).
card = intel_backlight
use-actual-brightness = true
enable-scroll = true
label = BL %percentage%%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = VOL %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/fs]
type = internal/fs
; / and /home share the same filesystem here, so monitoring / covers both.
mount-0 = /
interval = 30
label-mounted = DISK %percentage_used%%
label-unmounted =

[module/memory]
type = internal/memory
interval = 2
label = RAM %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage%%

[module/wlan]
type = internal/network
; Wireless interface on this machine (ls /sys/class/net).
interface = wlp0s20f3
interface-type = wireless
interval = 5
label-connected = %essid% %signal%%
label-disconnected = wifi down
label-disconnected-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
; Battery/adapter names on this machine (ls /sys/class/power_supply).
battery = BAT0
adapter = AC
low-at = 15
format-charging = <label-charging>
format-discharging = <label-discharging>
label-charging = CHR %percentage%%
label-discharging = BAT %percentage%%
label-full = FULL
label-low = LOW %percentage%%

[module/date]
type = internal/date
interval = 30
; Uses the system timezone (now Europe/London). 24-hour clock, no seconds.
date = %Y-%m-%d %H:%M
label = %date%

[settings]
; Reload bars automatically when outputs change (dock/undock).
screenchange-reload = true
