# Disable the PC-speaker beep at the source.
#
# The pcspkr kernel module drives the motherboard's PC speaker -- the source of
# the loud hardware "beep" on bell events. Silencing it here (rather than with a
# per-session `xset -b`) kills the beep system-wide, in both X and the TTY/console,
# permanently, with nothing to re-run per login. snd_pcsp is the ALSA equivalent
# (not loaded on this machine, blacklisted for good measure).
#
# Installed to /etc/modprobe.d/nobeep.conf by install.sh. Unload immediately with
# `sudo modprobe -r pcspkr`; otherwise it takes effect on the next boot.
#
# `blacklist` stops the module from being auto-loaded on demand; the `install ...
# /bin/true` lines also stop it loading if something requests it explicitly.
blacklist pcspkr
blacklist snd_pcsp
install pcspkr /bin/true
install snd_pcsp /bin/true
