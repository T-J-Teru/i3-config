# picom compositor configuration for this i3 setup.
# Enables translucency, soft drop shadows, frosted-glass blur and rounded
# corners -- most visibly for the deadd notification cards, but it lifts the
# whole desktop. Started from the i3 config (exec_always). See "Compositor
# (picom)" in i3-setup.md.

# GLX backend: needed for good blur/shadow performance (Intel iGPU is fine).
backend = "glx";
vsync = true;

# ---- Drop shadows ----------------------------------------------------------
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -18;
shadow-offset-y = -18;
shadow-exclude = [
  "window_type = 'dock'",       # polybar
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@"       # GTK client-side-decoration shadow regions
];

# ---- Rounded corners -------------------------------------------------------
# 12px matches the deadd card radius. Docks (polybar) stay square.
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# ---- Fading ----------------------------------------------------------------
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

# ---- Transparency + blur ---------------------------------------------------
# Blur whatever shows through translucent windows (the deadd frosted cards).
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@"
];

# ---- Dim inactive windows --------------------------------------------------
# Fade every non-focused window so the active one is easy to spot (ported from
# the old `window-dimmer` script, which ran compton with --inactive-dim 0.5).
# 0.0 = no dim, 1.0 = black; 0.5 matches the old feel -- tune to taste.
inactive-dim = 0.5;
# Windows here are always treated as focused (never dimmed). The dock/desktop/
# notification excludes are new (the old machine had no polybar or deadd); the
# rest port the old --focus-exclude rules.
focus-exclude = [
  "window_type = 'dock'",                    # polybar
  "window_type = 'desktop'",                 # wallpaper root
  "window_type = 'notification'",            # deadd pop-ups / OSD
  "name = 'screensaver'",                    # xscreensaver
  "class_g = 'i3-frame'",                    # i3 split/tab frame decorations
  "class_i = 'rofi'",                        # launcher / switchers
  "class_g = 'Deadd-notification-center'",   # deadd notification center
  "! name~=''"                               # windows with no name (transient helpers)
];

# ---- Detection / correctness ----------------------------------------------
detect-rounded-corners = true;
detect-client-opacity = true;   # honour app-set _NET_WM_WINDOW_OPACITY (deadd/CSS)
detect-transient = true;
use-damage = true;
